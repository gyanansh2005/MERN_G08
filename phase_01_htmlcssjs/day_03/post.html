<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #parent{
            display: flex;
            flex-direction: column;
            /* border: 2px solid; */
            justify-content: center;
            align-items: center;
            width: 30%;
            margin-top: 100px;
            margin-left: 35%;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            border-radius: 30px;
        }
        #image>img{
            margin-top: 20px;
           border-radius: 20px;
           height: 200px;
           width: 230px;
        }
        button{
            border: none;
            background-color: #fff;
            border-radius: 20px;
        }
        button:hover{
            cursor: pointer;
            background-color:grey;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="image">
            <img src="https://th.bing.com/th/id/OIP.o01meSRfIBYH1LiardrnxwHaEo?w=259&h=180&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3" alt="">
        </div>

        <div id="texts">
            <h3>King Khan</h3>
            <button id="like"><img src="" alt="">👍</button>Likes: <span id="likeCount">0</span>
            <br><br>
            <button id="dislike"><img src="" alt="">👎</button>Dislikes: <span id="dislikeCount">0</span>
            <br><br>
        </div>
    </div>
</body>
</html>
