<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    </style>
</head>
<body>
    <div>
        <div id="forms">
            <form action="">
                <div>
                <label for="">Name: </label>
                <input type="text" name="" id="name" placeholder="Jhon Doe">
                </div>

                <div>
                <label for="">Email: </label>
                <input type="email" placeholder="xyz@gmail.com" id="email">
                </div>

                <div>
                <label for="">Age: </label>
                <input type="number" placeholder="20" id="age">
                </div>

                <div>
                    <button id="submit">Submit</button>
                </div>

            </form>
        </div>
        <div>
            <h3>Student Data</h3>
            <table border="4">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                </tr>
                <tbody id="data">

                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
<script>
    var btn=document.getElementById("submit")
    btn.addEventListener("click",submitButton)
    function submitButton(event){

        event.preventDefault()

        var name=document.getElementById("name")
        var email=document.getElementById("email")
        var age=document.getElementById("age")

        var valueName=name.value
        var valueEmail=email.value
        var valueAge=age.value
        console.log(valueName)

        var tbody=document.getElementById("data")
        tbody.innerHTML+=`
                <tr>
                    <td>${valueName}</td>
                    <td>${valueEmail}</td>
                    <td>${valueAge}</td>
                </tr>
        `
        name.value=""
        email.value=""
        age.value=""
    }
</script>
